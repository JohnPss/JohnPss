name: Profile assets

# Builds the 3D contribution graph and the snake for the README
# (the stats cards come from cool-readme.yml) and publishes them to the `output` branch,
# so `main` stays clean and nothing depends on rate-limited public APIs.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 03:00 in Brasília
  workflow_dispatch:
  push:
    branches: [main]
  pull_request: # lets a PR preview the README with real images

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ---------- 3D contribution graph ----------
      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Move 3D graph into dist
        run: mkdir -p dist && cp profile-3d-contrib/*.svg dist/

      # ---------- snake ----------
      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#00bfbf&color_dots=#161b22,#0e4d4d,#007a7a,#00a3a3,#00e5e5

      # ---------- publish ----------
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
