name: Profile assets

# Builds every dynamic image in the README (stats cards, pinned repos,
# 3D contribution graph, snake) and publishes them to the `output` branch,
# so `main` stays clean and nothing depends on rate-limited public APIs.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 03:00 in Brasília
  workflow_dispatch:
  push:
    branches: [main]
  pull_request: # lets a PR preview the README with real images

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

env:
  THEME: bg_color=0d1117&title_color=00bfbf&icon_color=00bfbf&text_color=c9d1d9&border_color=30363d&hide_border=false&border_radius=10

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ---------- stats cards ----------
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&rank_icon=github&${{ env.THEME }}
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&exclude_repo=MIC1-Atualizado,Desafio-Concert---Formando-Devs,k8s-alta-disponibilidade&${{ env.THEME }}
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- pinned repos ----------
      - name: Pin - NetCanDrug
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=NetCanDrug&description_lines_count=3&${{ env.THEME }}
          path: dist/pin-NetCanDrug.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - MovieRecoSystem
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=MovieRecoSystem&description_lines_count=3&${{ env.THEME }}
          path: dist/pin-MovieRecoSystem.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - FirePropagationSimulator
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=FirePropagationSimulator&description_lines_count=3&${{ env.THEME }}
          path: dist/pin-FirePropagationSimulator.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - borapelada
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=borapelada&description_lines_count=3&${{ env.THEME }}
          path: dist/pin-borapelada.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 3D contribution graph ----------
      - name: 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Move 3D graph into dist
        run: mkdir -p dist && cp profile-3d-contrib/*.svg dist/

      # ---------- snake ----------
      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#00bfbf&color_dots=#161b22,#0e4d4d,#007a7a,#00a3a3,#00e5e5

      # ---------- publish ----------
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
