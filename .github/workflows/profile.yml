name: Profile assets

# Renders the neofetch card (scripts/neofetch.py) and the snake, then publishes
# them to the `assets` branch so `main` stays clean.
#
# Optional: add a repo secret PROFILE_TOKEN (classic PAT with `repo` + `read:user`)
# to also count private contributions/commits. Falls back to GITHUB_TOKEN.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 03:00 in Brasília
  workflow_dispatch:
  push:
    branches: [main]
  pull_request: # lets a PR preview the README with real images

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Neofetch card
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          pip install --quiet pillow
          curl -sSL "https://github.com/${USERNAME}.png?size=400" -o avatar.png
          python scripts/neofetch.py avatar.png dist

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#007a7a&color_dots=#ebedf0,#b2e5e5,#66cccc,#00a3a3,#006666
            dist/snake-dark.svg?palette=github-dark&color_snake=#00bfbf&color_dots=#161b22,#0e4d4d,#007a7a,#00a3a3,#00e5e5

      - name: Publish to assets branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: assets
          build_dir: dist
          keep_history: false
          commit_message: "chore: update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
